name: Informational Licensing Inventory (Non-Blocking)

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

env:
  RUNNER_IMAGE_LABEL: ubuntu-26.04
  SCANCODE_VERSION_TAG: v32.5.0
  SCANCODE_ARCHIVE_NAME: scancode-toolkit-v32.5.0_py3.12-linux.tar.gz
  SCANCODE_ARCHIVE_SHA256: 638adcd0af576d1f4d5b64dde228724b3ca4fdee2c4de20d88e4356be353f027

jobs:
  licensing-inventory:
    name: Generate Source & Dependency Licensing Inventory (Informational Only)
    runs-on: ubuntu-26.04
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Verify & Install Stable Android SDK Platform 37.2 & Build-Tools 37.0.0
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --channel=0 --install \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Ensure gradlew is executable & verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Prepare Non-Secret .env Placeholder for Build Graph Resolution
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Set up Python 3.12 for ScanCode Toolkit (v32.5.0_py3.12)
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12.x'

      - name: Verify Python 3.12 Runtime & Virtualenv Prerequisite
        shell: bash
        run: |
          set -euo pipefail
          python3.12 --version
          python --version
          python3.12 -m venv --help > /dev/null

      - name: Download, Verify & Bootstrap Pinned ScanCode Toolkit Standalone Archive (v32.5.0)
        id: scancode_setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/licensing/diagnostics
          INSTALL_LOG="reports/licensing/diagnostics/scancode-install.log"
          ARCHIVE_PATH="${RUNNER_TEMP}/${SCANCODE_ARCHIVE_NAME}"
          EXTRACT_DIR="${RUNNER_TEMP}/scancode-toolkit-${SCANCODE_VERSION_TAG}"
          DOWNLOAD_URL="https://github.com/aboutcode-org/scancode-toolkit/releases/download/${SCANCODE_VERSION_TAG}/${SCANCODE_ARCHIVE_NAME}"

          echo "Downloading ${DOWNLOAD_URL}" | tee "$INSTALL_LOG"
          if ! curl -fSL --retry 3 --retry-delay 2 -o "$ARCHIVE_PATH" "$DOWNLOAD_URL" >> "$INSTALL_LOG" 2>&1; then
            echo "SCANCODE_INSTALL_STATUS=INSTALL_FAILED" >> "$GITHUB_ENV"
            echo "ERROR: Failed to download ScanCode standalone archive from ${DOWNLOAD_URL}" | tee -a "$INSTALL_LOG"
            exit 1
          fi

          ACTUAL_SHA256=$(sha256sum "$ARCHIVE_PATH" | awk '{print $1}' | tr '[:upper:]' '[:lower:]')
          EXPECTED_SHA256=$(printf '%s' "$SCANCODE_ARCHIVE_SHA256" | tr '[:upper:]' '[:lower:]')
          echo "Archive SHA-256: actual=${ACTUAL_SHA256} expected=${EXPECTED_SHA256}" | tee -a "$INSTALL_LOG"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            rm -f "$ARCHIVE_PATH"
            echo "SCANCODE_INSTALL_STATUS=INSTALL_FAILED" >> "$GITHUB_ENV"
            echo "ERROR: ScanCode archive SHA-256 mismatch!" | tee -a "$INSTALL_LOG"
            exit 1
          fi
          echo "SCANCODE_INSTALL_STATUS=ARCHIVE_VERIFIED" >> "$GITHUB_ENV"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          tar -xzf "$ARCHIVE_PATH" -C "$EXTRACT_DIR" --strip-components=1 >> "$INSTALL_LOG" 2>&1
          rm -f "$ARCHIVE_PATH"

          if ! command -v python3.12 > /dev/null 2>&1; then
            echo "SCANCODE_INSTALL_STATUS=BOOTSTRAP_FAILED_PYTHON_MISSING" >> "$GITHUB_ENV"
            echo "ERROR: python3.12 is required by ${SCANCODE_ARCHIVE_NAME} but was not found on PATH" | tee -a "$INSTALL_LOG"
            exit 1
          fi

          echo "Python 3.12 runtime: $(python3.12 --version 2>&1)" | tee -a "$INSTALL_LOG"
          if [ -x "${EXTRACT_DIR}/configure" ]; then
            if ! PYTHON_EXECUTABLE="$(command -v python3.12)" "${EXTRACT_DIR}/configure" >> "$INSTALL_LOG" 2>&1; then
              echo "SCANCODE_INSTALL_STATUS=BOOTSTRAP_FAILED_PYTHON_MISSING" >> "$GITHUB_ENV"
              echo "ERROR: ScanCode ./configure bootstrap failed" | tee -a "$INSTALL_LOG"
              exit 1
            fi
          fi

          SCANCODE_EXE="${EXTRACT_DIR}/scancode"
          if [ ! -x "$SCANCODE_EXE" ]; then
            echo "SCANCODE_INSTALL_STATUS=BOOTSTRAP_FAILED_PYTHON_MISSING" >> "$GITHUB_ENV"
            echo "ERROR: Extracted ScanCode binary not found or not executable at ${SCANCODE_EXE}" | tee -a "$INSTALL_LOG"
            exit 1
          fi

          if ! "$SCANCODE_EXE" --version > reports/licensing/diagnostics/scancode-version.log 2>&1; then
            echo "SCANCODE_INSTALL_STATUS=VERSION_CHECK_FAILED" >> "$GITHUB_ENV"
            echo "ERROR: scancode --version preflight failed" | tee -a "$INSTALL_LOG"
            cat reports/licensing/diagnostics/scancode-version.log >> "$INSTALL_LOG"
            exit 1
          fi

          if ! "$SCANCODE_EXE" --help > reports/licensing/diagnostics/scancode-help.log 2>&1; then
            echo "SCANCODE_INSTALL_STATUS=VERSION_CHECK_FAILED" >> "$GITHUB_ENV"
            echo "ERROR: scancode --help preflight failed" | tee -a "$INSTALL_LOG"
            cat reports/licensing/diagnostics/scancode-help.log >> "$INSTALL_LOG"
            exit 1
          fi

          echo "SCANCODE_BIN=${SCANCODE_EXE}" >> "$GITHUB_ENV"
          echo "SCANCODE_INSTALL_STATUS=INSTALLED" >> "$GITHUB_ENV"
          cat reports/licensing/diagnostics/scancode-version.log | tee -a "$INSTALL_LOG"

      - name: Generate Licensing Inventory Reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_CMD="python3"
          if command -v python3.12 > /dev/null 2>&1; then
            PYTHON_CMD="python3.12"
          fi
          "$PYTHON_CMD" scripts/generate_licensing_inventory.py --output-dir reports/licensing

      - name: Publish Inventory Summary & Completeness Status to Job Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "reports/licensing/licensing-inventory-status.json" ]; then
            COMPLETENESS=$(python3 -c 'import json; print(json.load(open("reports/licensing/licensing-inventory-status.json")).get("scanCompleteness", "INCOMPLETE"))')
            SC_STATUS=$(python3 -c 'import json; print(json.load(open("reports/licensing/licensing-inventory-status.json")).get("scancodeStatus", "UNKNOWN"))')
            if [ "$COMPLETENESS" != "COMPLETE" ]; then
              echo "::warning title=Informational Licensing Inventory Incomplete::Inventory scanCompleteness=${COMPLETENESS}, scancodeStatus=${SC_STATUS}. See reports/licensing/diagnostics/ in the uploaded artifact."
            fi
          else
            echo "::warning title=Informational Licensing Inventory Incomplete::licensing-inventory-status.json was not produced."
          fi

          if [ -f "reports/licensing/licensing-inventory-summary.md" ]; then
            cat reports/licensing/licensing-inventory-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Informational Licensing Inventory: INCOMPLETE" >> "$GITHUB_STEP_SUMMARY"
            echo "Report generation did not complete; see step logs and diagnostic artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Licensing Inventory Reports & Diagnostics Artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: precisioncad-licensing-inventory-${{ github.sha }}
          path: reports/licensing/
          if-no-files-found: warn
          retention-days: 30
