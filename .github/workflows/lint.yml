name: Android Lint (Release)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-release:
    name: Run Gradle lintRelease
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Verify & Install Stable Android SDK Packages (API 37.2 & Build-Tools 37.0.0)
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --channel=0 --install \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Ensure gradlew is executable & verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Prepare .env File for Secrets Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Run Android Lint (./gradlew :app:lintRelease) with Scoped Non-Production Variant Placeholder
        shell: bash
        run: |
          set -euo pipefail
          # Used exclusively inside this lint-only step so AGP can evaluate variant signingConfigs
          # during lintRelease without requiring production signing secrets. Never used to assemble
          # or publish any APK, and deleted immediately upon step completion.
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          THROW_KEY="${RUNNER_TEMP}/lint-throwaway-nonprod-${GITHUB_RUN_ID:-local}.jks"
          THROW_PASS="lint_only_nonprod_throwaway"
          trap 'rm -f "$THROW_KEY"' EXIT
          keytool -genkeypair -v \
            -keystore "$THROW_KEY" \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -alias upload \
            -storepass "$THROW_PASS" \
            -keypass "$THROW_PASS" \
            -dname "CN=Lint Throwaway Non-Production, OU=CI, O=NonProd, L=Local, S=NA, C=US"

          KEYSTORE_PATH="$THROW_KEY" \
          STORE_PASSWORD="$THROW_PASS" \
          KEY_ALIAS="upload" \
          KEY_PASSWORD="$THROW_PASS" \
          ./gradlew :app:lintRelease --no-daemon --stacktrace

      - name: Upload Lint Report Artifacts (HTML, XML & TXT)
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-lint-release-reports
          path: |
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
