name: Android Lint (Release)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-release:
    name: Run Gradle lintRelease
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env File for Secrets Gradle Plugin
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Prepare Debug & Release Signing Keystores for Lint Configuration
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "${GITHUB_WORKSPACE}/my-upload-key.jks" ]; then
            FALLBACK_PASS="precisioncad_release_2026"
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias upload \
              -storepass "$FALLBACK_PASS" \
              -keypass "$FALLBACK_PASS" \
              -dname "CN=PrecisionCAD Studio, OU=Engineering, O=PrecisionCAD, L=Tokyo, S=Tokyo, C=JP"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${FALLBACK_PASS}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${FALLBACK_PASS}" >> "$GITHUB_ENV"
          fi

      - name: Run Android Lint (lintRelease)
        run: |
          gradle lintRelease --no-daemon --stacktrace

      - name: Upload Lint Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-release-reports
          path: |
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
