name: Android Lint (Release)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-release:
    name: Run Gradle lintRelease
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages (API 37.2 & Build-Tools 37.0.0)
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;37.0.0"

      - name: Setup Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Prepare .env File for Secrets Gradle Plugin
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Prepare Disposable Non-Production Keystores for Lint Variant Evaluation Only
        run: |
          # Note: Used exclusively so AGP can evaluate variant signingConfig file paths during lintRelease.
          # Never used to sign or publish any Release APK.
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          THROW_KEY="${RUNNER_TEMP}/lint-throwaway-nonprod.jks"
          THROW_PASS="lint_only_nonprod_throwaway"
          keytool -genkeypair -v \
            -keystore "$THROW_KEY" \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -alias upload \
            -storepass "$THROW_PASS" \
            -keypass "$THROW_PASS" \
            -dname "CN=Lint Throwaway Non-Production, OU=CI, O=NonProd, L=Local, S=NA, C=US"
          echo "KEYSTORE_PATH=${THROW_KEY}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${THROW_PASS}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=upload" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${THROW_PASS}" >> "$GITHUB_ENV"

      - name: Run Android Lint (./gradlew :app:lintRelease)
        run: |
          ./gradlew :app:lintRelease --no-daemon --stacktrace

      - name: Upload Lint Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-release-reports
          path: |
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14
