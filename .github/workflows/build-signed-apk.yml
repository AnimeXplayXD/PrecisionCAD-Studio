name: Build & Sign PrecisionCAD Studio APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'APK variant to build (release requires all 5 production signing secrets; debug builds without production secrets; both builds both)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
      version_name_override:
        description: 'Optional versionName override (e.g., 1.18.1)'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish signed Release APK to GitHub Releases (requires release or both variant + verified production signing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  PRIMARY_RELEASE_BRANCH: main
  RUNNER_IMAGE_LABEL: ubuntu-26.04

jobs:
  build-signed-apk:
    name: Build & Sign Android APK
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Verify & Install Stable Android SDK Packages (API 37.2 & Build-Tools 37.0.0)
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --channel=0 --install \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Ensure gradlew is executable & verify Gradle Wrapper version
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Compute Automated Version Code, Version Name & Monotonicity Check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION_NAME_OVERRIDE: ${{ inputs.version_name_override }}
        run: |
          set -euo pipefail

          BASE_CODE=$(grep -E '^VERSION_CODE=' version.properties 2>/dev/null | cut -d'=' -f2 | tr -d '[:space:]' || echo "18")
          MAJOR=$(grep -E '^VERSION_MAJOR=' version.properties 2>/dev/null | cut -d'=' -f2 | tr -d '[:space:]' || echo "1")
          MINOR=$(grep -E '^VERSION_MINOR=' version.properties 2>/dev/null | cut -d'=' -f2 | tr -d '[:space:]' || echo "18")
          PATCH=$(grep -E '^VERSION_PATCH=' version.properties 2>/dev/null | cut -d'=' -f2 | tr -d '[:space:]' || echo "0")

          COMPUTED_VERSION_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))

          # Paginate all GitHub Releases and verify monotonic versionCode progression.
          # Fails closed if the GitHub Releases API request fails or returns malformed data.
          LATEST_PUBLISHED_CODE=$(python3 - << 'PYEOF'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          max_code = 0
          page = 1

          while True:
              url = f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2026-03-10",
                      "User-Agent": "PrecisionCAD-Release-Pipeline/18.1",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      if resp.status != 200:
                          sys.stderr.write(f"ERROR: GitHub Releases API returned HTTP {resp.status}\n")
                          sys.exit(1)
                      payload = json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  sys.stderr.write(f"ERROR: Failed to query GitHub Releases API (HTTP {exc.code})\n")
                  sys.exit(1)
              except Exception as exc:
                  sys.stderr.write(f"ERROR: Failed to query GitHub Releases API: {exc}\n")
                  sys.exit(1)

              if not isinstance(payload, list):
                  sys.stderr.write("ERROR: Unexpected GitHub Releases API payload format (expected JSON array).\n")
                  sys.exit(1)

              if not payload:
                  break

              for rel in payload:
                  if not isinstance(rel, dict) or rel.get("draft") or rel.get("prerelease"):
                      continue
                  body = rel.get("body") or ""
                  tag = rel.get("tag_name") or ""
                  rel_code = None
                  m_meta = re.search(r"versionCode:\s*(\d+)", body)
                  if m_meta:
                      rel_code = int(m_meta.group(1))
                  else:
                      m_tag = re.search(r"-b(\d+)(?:-[0-9a-fA-F]+)?$", tag)
                      if m_tag:
                          rel_code = int(m_tag.group(1))
                  if rel_code is not None:
                      max_code = max(max_code, rel_code)
                  else:
                      sys.stderr.write(
                          f"WARNING: Published stable release '{tag}' has no parseable versionCode in metadata or tag.\n"
                      )

              if len(payload) < 100:
                  break
              page += 1

          print(max_code)
          PYEOF
          )

          if [ "$COMPUTED_VERSION_CODE" -le "$LATEST_PUBLISHED_CODE" ]; then
            echo "ERROR: Computed versionCode ($COMPUTED_VERSION_CODE) is not strictly greater than latest published stable versionCode ($LATEST_PUBLISHED_CODE)."
            exit 1
          fi

          if [ -n "${INPUT_VERSION_NAME_OVERRIDE:-}" ]; then
            if [[ ! "$INPUT_VERSION_NAME_OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9._-]+)?$ ]]; then
              echo "ERROR: Invalid version_name_override format. Expected numeric version string (e.g. 1.18.1)."
              exit 1
            fi
            COMPUTED_VERSION_NAME="$INPUT_VERSION_NAME_OVERRIDE"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            RAW_TAG_VER="${GITHUB_REF_NAME#v}"
            COMPUTED_VERSION_NAME="${RAW_TAG_VER%%-b*}"
          else
            COMPUTED_VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}.${GITHUB_RUN_NUMBER}"
          fi

          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            RELEASE_TAG="v${COMPUTED_VERSION_NAME}-b${COMPUTED_VERSION_CODE}-${SHORT_SHA}"
          fi

          COMMIT_SUBJECT=$(git log -1 --pretty=%s | tr -d '\r')
          if [ -z "$COMMIT_SUBJECT" ]; then
            COMMIT_SUBJECT="PrecisionCAD Studio v${COMPUTED_VERSION_NAME} (build ${COMPUTED_VERSION_CODE})"
          fi

          echo "VERSION_CODE=${COMPUTED_VERSION_CODE}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${COMPUTED_VERSION_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=${COMMIT_SUBJECT}" >> "$GITHUB_ENV"

          echo "### PrecisionCAD Studio Build & Versioning Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **applicationId**: \`com.precisioncad.studio\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **versionCode**: \`${COMPUTED_VERSION_CODE}\` (previous max stable: \`${LATEST_PUBLISHED_CODE}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **versionName**: \`${COMPUTED_VERSION_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **releaseTag**: \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **commitSha**: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **runNumber**: \`${GITHUB_RUN_NUMBER}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **runnerImage**: \`${RUNNER_IMAGE_LABEL}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare .env File for Secrets Gradle Plugin
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

      - name: Prepare Debug Keystore (debug.keystore)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare Persistent Release Signing Keystore (Fail-Closed Policy)
        if: ${{ github.event_name != 'pull_request' && inputs.build_variant != 'debug' }}
        shell: bash
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          set +x

          if [ -z "$SECRET_KEYSTORE_BASE64" ] || [ -z "$SECRET_STORE_PASSWORD" ] || [ -z "$SECRET_KEY_PASSWORD" ] || [ -z "$SECRET_KEY_ALIAS" ] || [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: Missing required production release signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS, RELEASE_CERT_SHA256)."
            echo "Production Release builds fail closed and never generate a replacement signing key."
            exit 1
          fi

          KEYSTORE_FILE="${RUNNER_TEMP}/precisioncad-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}.jks"
          umask 077
          if ! printf '%s' "$SECRET_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE" 2>/dev/null; then
            rm -f "$KEYSTORE_FILE"
            echo "ERROR: Failed to decode KEYSTORE_BASE64 into a valid keystore binary."
            exit 1
          fi
          chmod 600 "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            rm -f "$KEYSTORE_FILE"
            echo "ERROR: Decoded release keystore file is empty."
            exit 1
          fi

          KEYTOOL_OUT=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$SECRET_STORE_PASSWORD" -alias "$SECRET_KEY_ALIAS" 2>/dev/null || true)
          if [ -z "$KEYTOOL_OUT" ]; then
            rm -f "$KEYSTORE_FILE"
            echo "ERROR: Release keystore could not be read or does not contain the configured KEY_ALIAS."
            exit 1
          fi

          ACTUAL_CERT_SHA256=$(printf '%s\n' "$KEYTOOL_OUT" | grep -i "SHA256:" | head -n 1 | sed -E 's/^.*SHA256:[[:space:]]*//' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          CLEAN_EXPECTED=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')

          if [[ ! "$ACTUAL_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]] || [[ ! "$CLEAN_EXPECTED" =~ ^[0-9a-f]{64}$ ]] || [ "$ACTUAL_CERT_SHA256" != "$CLEAN_EXPECTED" ]; then
            rm -f "$KEYSTORE_FILE"
            echo "ERROR: Release keystore SHA-256 certificate fingerprint does not match expected trusted RELEASE_CERT_SHA256."
            exit 1
          fi

          # Persist only the non-secret temporary keystore file path; never write passwords to $GITHUB_ENV.
          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "Verified production signing certificate SHA-256 fingerprint: ${ACTUAL_CERT_SHA256}"

      - name: Run Unit Tests & Release Lint Before Assembly
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:lintRelease --no-daemon --stacktrace

      - name: Build Signed Release APK
        if: ${{ github.event_name != 'pull_request' && inputs.build_variant != 'debug' }}
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build Debug APK
        if: ${{ github.event_name == 'pull_request' || inputs.build_variant == 'debug' || inputs.build_variant == 'both' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Single APK Output, Package Identity, Version & Signing Certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
          INPUT_BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1)
          rm -f SHA256SUMS.txt

          python3 scripts/verify_apksigner_certificate.py --self-test

          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] && [ "${INPUT_BUILD_VARIANT}" != "debug" ]; then
            RELEASE_APK_COUNT=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | wc -l)
            if [ "$RELEASE_APK_COUNT" -ne 1 ]; then
              echo "ERROR: Expected exactly 1 release APK, found $RELEASE_APK_COUNT"
              exit 1
            fi
            RAW_RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name "*.apk" | head -n 1)
            SIGNER_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$RAW_RELEASE_APK")
            printf '%s\n' "$SIGNER_OUTPUT"

            APK_CERT_SHA256=$(printf '%s\n' "$SIGNER_OUTPUT" | python3 scripts/verify_apksigner_certificate.py --expected "$EXPECTED_CERT_SHA256" --quiet-digest-only)
            if [[ ! "$APK_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "ERROR: Parsed APK signer certificate fingerprint is not a valid 64-character lowercase hex digest."
              exit 1
            fi
            echo "Verified signed Release APK certificate SHA-256 fingerprint matches trusted RELEASE_CERT_SHA256: ${APK_CERT_SHA256}"

            BADGING=$("$AAPT2" dump badging "$RAW_RELEASE_APK")
            echo "$BADGING" | grep -q "package: name='com.precisioncad.studio'" || {
              echo "ERROR: APK package ID is not com.precisioncad.studio"
              exit 1
            }
            echo "$BADGING" | grep -q "versionCode='${VERSION_CODE}'" || {
              echo "ERROR: APK versionCode does not match expected ${VERSION_CODE}"
              exit 1
            }
            echo "$BADGING" | grep -q "versionName='${VERSION_NAME}'" || {
              echo "ERROR: APK versionName does not match expected ${VERSION_NAME}"
              exit 1
            }

            RELEASE_APK_NAME="PrecisionCAD-Studio-v${VERSION_NAME}-b${VERSION_CODE}-release.apk"
            cp "$RAW_RELEASE_APK" "$RELEASE_APK_NAME"
            RELEASE_SHA256=$(sha256sum "$RELEASE_APK_NAME" | awk '{print $1}')
            echo "${RELEASE_SHA256}  ${RELEASE_APK_NAME}" >> SHA256SUMS.txt
            echo "RELEASE_APK_NAME=${RELEASE_APK_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_SHA256=${RELEASE_SHA256}" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNER_SHA256=${APK_CERT_SHA256}" >> "$GITHUB_ENV"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${INPUT_BUILD_VARIANT}" = "debug" ] || [ "${INPUT_BUILD_VARIANT}" = "both" ]; then
            DEBUG_APK_COUNT=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | wc -l)
            if [ "$DEBUG_APK_COUNT" -ne 1 ]; then
              echo "ERROR: Expected exactly 1 debug APK, found $DEBUG_APK_COUNT"
              exit 1
            fi
            RAW_DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)
            "$APKSIGNER" verify --verbose --print-certs "$RAW_DEBUG_APK"
            DEBUG_APK_NAME="PrecisionCAD-Studio-v${VERSION_NAME}-b${VERSION_CODE}-debug.apk"
            cp "$RAW_DEBUG_APK" "$DEBUG_APK_NAME"
            DEBUG_SHA256=$(sha256sum "$DEBUG_APK_NAME" | awk '{print $1}')
            echo "${DEBUG_SHA256}  ${DEBUG_APK_NAME}" >> SHA256SUMS.txt
            echo "DEBUG_APK_NAME=${DEBUG_APK_NAME}" >> "$GITHUB_ENV"
          fi

          if [ -f "SHA256SUMS.txt" ]; then
            echo "### APK SHA-256 Checksums" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean Up Staged Production Keystore
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_PATH:-}" ] && [ -f "${KEYSTORE_PATH}" ]; then
            rm -f "${KEYSTORE_PATH}"
          fi
          rm -f "${RUNNER_TEMP}"/precisioncad-release-*.jks 2>/dev/null || true

      - name: Upload Lint Report Artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-lint-release-reports
          path: |
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Direct Signed Release APK Artifact (Single File, Unarchived)
        if: ${{ github.event_name != 'pull_request' && inputs.build_variant != 'debug' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.RELEASE_APK_NAME }}
          path: ${{ env.RELEASE_APK_NAME }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload Direct Debug APK Artifact (Single File, Unarchived)
        if: ${{ github.event_name == 'pull_request' || inputs.build_variant == 'debug' || inputs.build_variant == 'both' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.DEBUG_APK_NAME }}
          path: ${{ env.DEBUG_APK_NAME }}
          archive: false
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SHA256 Checksums Artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: PrecisionCAD-Studio-v${{ env.VERSION_NAME }}-b${{ env.VERSION_CODE }}-SHA256SUMS.txt
          path: SHA256SUMS.txt
          archive: false
          if-no-files-found: warn
          retention-days: 30

      - name: Generate Structured Release Body & Machine-Readable Metadata
        if: >-
          github.event_name != 'pull_request' &&
          inputs.build_variant != 'debug' &&
          (
            (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) ||
            (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
          )
        shell: bash
        run: |
          set -euo pipefail
          python3 - << 'EOF'
          import os, subprocess

          prev_tag = ""
          try:
              tags = subprocess.check_output(["git", "tag", "--sort=-creatordate"], text=True).splitlines()
              cur_tag = os.environ.get("RELEASE_TAG", "")
              for t in tags:
                  if t.strip() and t.strip() != cur_tag:
                      prev_tag = t.strip()
                      break
          except Exception:
              prev_tag = ""

          cmd = ["git", "log", "--pretty=%s"] + ([f"{prev_tag}..HEAD"] if prev_tag else ["-n", "15"])
          try:
              subjects = [s.strip() for s in subprocess.check_output(cmd, text=True).splitlines() if s.strip()]
          except Exception:
              subjects = [os.environ.get("RELEASE_TITLE", "Release update")]

          groups = {"New": [], "Fixes": [], "Optimisations": [], "Security": [], "Other": []}
          for s in subjects:
              low = s.lower()
              if any(k in low for k in ["sec", "cve", "vuln", "auth", "verify", "signature", "digest", "keystore"]):
                  groups["Security"].append(s)
              elif any(k in low for k in ["fix", "bug", "resolv", "repair", "hotfix", "regress", "lint"]):
                  groups["Fixes"].append(s)
              elif any(k in low for k in ["perf", "optim", "speed", "cache", "fast", "memory"]):
                  groups["Optimisations"].append(s)
              elif any(k in low for k in ["feat", "add", "new", "implement", "introduce", "support"]):
                  groups["New"].append(s)
              else:
                  groups["Other"].append(s)

          lines = []
          for heading in ["New", "Fixes", "Optimisations", "Security", "Other"]:
              items = groups[heading]
              if items:
                  lines.append(f"## {heading}")
                  for item in items:
                      lines.append(f"- {item}")
                  lines.append("")

          if not lines:
              lines = ["## Other", f"- {os.environ.get('RELEASE_TITLE', 'PrecisionCAD Studio release')}", ""]

          version_name = os.environ["VERSION_NAME"]
          version_code = os.environ["VERSION_CODE"]
          asset_name = os.environ["RELEASE_APK_NAME"]
          commit_sha = os.environ["GITHUB_SHA"]
          release_tag = os.environ["RELEASE_TAG"]
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          sha256_hex = os.environ["RELEASE_SHA256"]
          signer_sha256 = os.environ.get("RELEASE_SIGNER_SHA256", "")

          lines.extend([
              "## Build & Verification Provenance",
              f"- **Package ID**: `com.precisioncad.studio`",
              f"- **Version Name**: `{version_name}`",
              f"- **Version Code**: `{version_code}`",
              f"- **Release Tag**: `{release_tag}`",
              f"- **Commit SHA**: `{commit_sha}`",
              f"- **CI Run Number**: `{run_number}`",
              f"- **APK Asset**: `{asset_name}`",
              f"- **APK SHA-256**: `{sha256_hex}`",
              "",
              "---",
              "",
              "<!-- PRECISIONCAD-RELEASE-METADATA",
              "packageId: com.precisioncad.studio",
              f"versionName: {version_name}",
              f"versionCode: {version_code}",
              f"releaseTag: {release_tag}",
              f"runNumber: {run_number}",
              f"assetName: {asset_name}",
              f"commitSha: {commit_sha}",
              f"sha256: {sha256_hex}",
              f"signerSha256: {signer_sha256}",
              "channel: stable",
              "-->"
          ])

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          EOF

      - name: Publish Single Production Release APK to Public GitHub Release
        if: >-
          github.event_name != 'pull_request' &&
          inputs.build_variant != 'debug' &&
          (
            (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) ||
            (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
          )
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ env.RELEASE_APK_NAME }}
          generate_release_notes: false
